<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <section class="card">
            <h1>Gerenciador de Tarefas</h1>
            <p class="subtitle">Organize suas atividades de forma simples</p>

            <form action="{{ url_for('adicionar') }}" method="POST" class="task-form">
                <input
                    type="text"
                    name="titulo"
                    placeholder="Digite uma nova tarefa..."
                    required
                >
                <button type="submit">Adicionar</button>
            </form>

            <div class="task-list">
                {% if tarefas %}
                    {% for tarefa in tarefas %}
                        <div class="task-item {% if tarefa.concluida %}done{% endif %}">
                            <span>{{ tarefa.titulo }}</span>

                            <div class="actions">
                                <a href="{{ url_for('concluir', id_tarefa=tarefa.id) }}" class="btn-check">
                                    {% if tarefa.concluida %}Desmarcar{% else %}Concluir{% endif %}
                                </a>
                                <a href="{{ url_for('remover', id_tarefa=tarefa.id) }}" class="btn-delete">
                                    Remover
                                </a>
                            </div>
                        </div>
                    {% endfor %}
                {% else %}
                    <p class="empty">Nenhuma tarefa cadastrada ainda.</p>
                {% endif %}
            </div>
        </section>
    </main>
</body>
</html>
